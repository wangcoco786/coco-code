<style>

@media print {
  body { background: #fff; }

}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════
  页面 1：Direct ship to retailer (AX下单)

════════════════════════════════════════════════ -->
<div class="page">
<svg width="1100" height="900" xmlns="http://www.w3.org/2000/svg">

  </defs>

  <!-- 大标题 -->
  <text x="550" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Direct ship to retailer：retailer联系Glory销售在AX下单给Vendor</text>

  <line x1="38" y1="490" x2="1100" y2="490" stroke="#ccc" stroke-width="1"/>
  <line x1="38" y1="660" x2="1100" y2="660" stroke="#ccc" stroke-width="1"/>

  <line x1="700" y1="60" x2="700" y2="900" stroke="#aaa" stroke-width="1" stroke-dasharray="5,4"/>

  <rect x="60" y="390" width="120" height="50" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="120" y="420" text-anchor="middle" font-size="13">接收PO和SO</text>

  <!-- OMS行 -->
  <line x1="120" y1="490" x2="120" y2="510" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="55" y="510" width="135" height="55" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="122" y="533" text-anchor="middle" font-size="13">指定Vendor仓库</text>

  <line x1="120" y1="676" x2="120" y2="695" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="48" y="695" width="148" height="70" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="122" y="716" text-anchor="middle" font-size="12">指定Vendor仓库消费消息</text>

  <rect x="455" y="220" width="120" height="45" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="515" y="248" text-anchor="middle" font-size="13">接收RC</text>

  <!-- EDI行中列: 接收RC -->
  <line x1="515" y1="365" x2="515" y2="385" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="520" y="382" font-size="11" fill="#555">推送RC</text>
  <rect x="455" y="390" width="120" height="45" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="515" y="418" text-anchor="middle" font-size="13">接收RC</text>

  <!-- OMS行中列: 接收RC和DC + 菱形 -->
  <line x1="515" y1="490" x2="515" y2="510" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="450" y="510" width="130" height="45" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="515" y="538" text-anchor="middle" font-size="13">接收RC和DC</text>
  <line x1="515" y1="555" x2="515" y2="570" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="520" y="576" font-size="11" fill="#555">发送RC和DC</text>
  <polygon points="515,580 560,615 515,650 470,615" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="515" y="618" text-anchor="middle" font-size="12">RC接收成功</text>

  <!-- Vendor Portal中列: Shipment Confirmation → 录入/操作 → 创建 -->
  <line x1="515" y1="660" x2="515" y2="678" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="440" y="678" width="150" height="48" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="515" y="697" text-anchor="middle" font-size="13">Shipment</text>
  <text x="515" y="715" text-anchor="middle" font-size="13">Confirmation</text>
  <!-- 分叉箭头到左 -->
  <line x1="515" y1="726" x2="515" y2="736" stroke="#333" stroke-width="1.5"/>
  <line x1="515" y1="736" x2="415" y2="736" stroke="#333" stroke-width="1.5"/>
  <line x1="415" y1="736" x2="415" y2="752" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- 分叉箭头到右 -->
  <line x1="515" y1="736" x2="610" y2="736" stroke="#333" stroke-width="1.5"/>
  <line x1="610" y1="736" x2="610" y2="752" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- 录入Vessel Info -->
  <rect x="355" y="752" width="120" height="48" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="415" y="776" text-anchor="middle" font-size="13">录入Vessel Info</text>
  <!-- 操作Shipment Pocess -->
  <rect x="550" y="752" width="120" height="48" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="610" y="771" text-anchor="middle" font-size="13">操作</text>
  <text x="610" y="789" text-anchor="middle" font-size="13">Shipment Pocess</text>

  <line x1="670" y1="776" x2="720" y2="776" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <!-- 汇聚 -->
  <line x1="415" y1="800" x2="415" y2="820" stroke="#333" stroke-width="1.5"/>
  <line x1="610" y1="800" x2="610" y2="820" stroke="#333" stroke-width="1.5"/>
  <line x1="415" y1="820" x2="515" y2="820" stroke="#333" stroke-width="1.5"/>
  <line x1="610" y1="820" x2="515" y2="820" stroke="#333" stroke-width="1.5"/>
  <line x1="515" y1="820" x2="515" y2="833" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- 创建Vendor Shiment -->
  <rect x="440" y="833" width="150" height="48" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="515" y="852" text-anchor="middle" font-size="13">创建Vendor Shiment</text>
  <text x="515" y="869" text-anchor="middle" font-size="11" fill="#555">(可搭配多个Vendor Order创建)</text>
  <line x1="515" y1="881" x2="515" y2="892" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="515" cy="872" r="0"/><!-- placeholder -->

  <!-- ── 列3（右）：x=700~1100 ── -->
  <!-- AX行右: 接收DC + 开始圆 -->
  <circle cx="890" cy="80" r="14" fill="white" stroke="#333" stroke-width="1.5"/>
  <line x1="890" y1="94" x2="890" y2="115" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="895" y="116" font-size="11" fill="#555">推DC</text>
  <rect x="830" y="215" width="120" height="45" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="890" y="243" text-anchor="middle" font-size="13">接收DC</text>
  <line x1="890" y1="260" x2="890" y2="275" stroke="#333" stroke-width="1.5"/>
  <text x="895" y="273" font-size="11" fill="#555">推送DC</text>

  <!-- EDI行右: 接收DC -->
  <line x1="890" y1="365" x2="890" y2="385" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="895" y="382" font-size="11" fill="#555">推送DC</text>
  <rect x="830" y="390" width="120" height="45" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="890" y="418" text-anchor="middle" font-size="13">接收DC</text>

  <!-- OMS行右: 返回ACK（从菱形出） -->
  <line x1="560" y1="615" x2="700" y2="615" stroke="#333" stroke-width="1.5"/>
  <text x="620" y="608" font-size="11" fill="#555">返回ACK</text>
  <line x1="700" y1="615" x2="730" y2="615" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- EDI层返回ACK -->
  <line x1="700" y1="412" x2="730" y2="412" stroke="#333" stroke-width="1.5"/>

  <text x="790" y="770" text-anchor="middle" font-size="12">List</text>
  <text x="790" y="789" text-anchor="middle" font-size="12">Document Info</text>
  <text x="790" y="806" text-anchor="middle" font-size="12">Pallet/Carton Info</text>
  <text x="790" y="823" text-anchor="middle" font-size="12">Label Info</text>

  <!-- 结束圆（中列Vendor Portal） -->
  <circle cx="515" cy="895" r="14" fill="white" stroke="#333" stroke-width="1.5"/>

</svg>
</div>

<!-- ═══════════════════════════════════════════════
  页面 2：Direct ship to facility (美仓)
  泳道：AX / EDI / OMS / Vendor Portal / WMS
════════════════════════════════════════════════ -->
<div class="page">
<svg width="1100" height="960" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#333"/>
    </marker>
  </defs>

  <!-- 大标题 -->
  <text x="550" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Direct ship to facility：美仓采购在AX系统下单给Vendor</text>

  <!-- 外框 -->
  <rect x="0" y="50" width="1100" height="900" fill="none" stroke="#333" stroke-width="1.5"/>

  <rect x="0" y="50" width="38" height="900" fill="#f7f7f7" stroke="#333" stroke-width="1"/>
  <!-- 泳道分隔 y: 200(AX), 310(EDI), 470(OMS), 710(VP), 870(WMS) -->
  <line x1="0" y1="200" x2="38" y2="200" stroke="#333" stroke-width="1"/>
  <line x1="0" y1="310" x2="38" y2="310" stroke="#333" stroke-width="1"/>
  <line x1="0" y1="470" x2="38" y2="470" stroke="#333" stroke-width="1"/>
  <line x1="0" y1="710" x2="38" y2="710" stroke="#333" stroke-width="1"/>
  <text transform="translate(19,125) rotate(-90)" text-anchor="middle" font-size="12" font-weight="600">AX</text>
  <text transform="translate(19,255) rotate(-90)" text-anchor="middle" font-size="12" font-weight="600">EDI</text>
  <text transform="translate(19,390) rotate(-90)" text-anchor="middle" font-size="12" font-weight="600">OMS</text>
  <text transform="translate(19,590) rotate(-90)" text-anchor="middle" font-size="11" font-weight="600">Vendor Portal</text>
  <text transform="translate(19,790) rotate(-90)" text-anchor="middle" font-size="12" font-weight="600">WMS</text>

  <line x1="38" y1="200" x2="1100" y2="200" stroke="#ccc" stroke-width="1"/>
  <line x1="38" y1="310" x2="1100" y2="310" stroke="#ccc" stroke-width="1"/>
  <line x1="38" y1="470" x2="1100" y2="470" stroke="#ccc" stroke-width="1"/>
  <line x1="38" y1="710" x2="1100" y2="710" stroke="#ccc" stroke-width="1"/>

  <!-- 竖向虚线 x=330, x=700 -->
  <line x1="330" y1="50" x2="330" y2="950" stroke="#aaa" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="700" y1="50" x2="700" y2="950" stroke="#aaa" stroke-width="1" stroke-dasharray="5,4"/>

  <text x="120" y="122" text-anchor="middle" font-size="13">美仓采购创建PO单</text>
  <text x="120" y="165" text-anchor="middle" font-size="11" fill="#555">推送PO</text>

  <line x1="160" y1="355" x2="185" y2="355" stroke="#333" stroke-width="1.5" marker-end="url(#arr3)"/>
  <rect x="185" y="330" width="115" height="50" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="242" y="352" text-anchor="middle" font-size="12">指定Vendor</text>
  <text x="242" y="368" text-anchor="middle" font-size="12">生产发货</text>
  <text x="185" y="398" font-size="11" fill="#555">推送kafka</text>
